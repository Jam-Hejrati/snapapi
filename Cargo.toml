[package]
name = "snapapi"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Detect potentially breaking changes between OpenAPI specifications."
license = "MIT"
repository = "https://github.com/Jam-Hejrati/snapapi"
readme = "README.md"

[dependencies]
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_json = "1"
thiserror = "2"
